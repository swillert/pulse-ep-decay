# GitLab CI for pulse-ep-decay
#
# Stages: lint -> test (Python matrix 3.10 / 3.11 / 3.12) -> deploy (mirror to GitHub)
#
# Each job creates an isolated venv, installs pulse-ep-decay in editable mode
# with the [dev] extra, and runs ruff + pytest. The pip wheel cache is
# persisted across runs as a job-level cache keyed on the lockfile-equivalent
# pyproject.toml.

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHONDONTWRITEBYTECODE: "1"

.python_setup: &python_setup
  before_script:
    - python -V
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip wheel
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .pip-cache/
      - .venv/

ruff:
  stage: lint
  image: python:3.12-slim
  <<: *python_setup
  script:
    - pip install "ruff>=0.6,<1"
    - ruff check src tests

.test_template: &test_template
  stage: test
  <<: *python_setup
  script:
    - pip install -e ".[dev]"
    - pip install pygeodesic || true   # optional: exact-geodesic comparison
    - pytest -v --maxfail=5
  coverage: '/^TOTAL.*?(\d+\%)$/'

test:py3.10:
  image: python:3.10
  <<: *test_template

test:py3.11:
  image: python:3.11
  <<: *test_template

test:py3.12:
  image: python:3.12
  <<: *test_template

reproduce:
  stage: test
  image: python:3.10
  <<: *python_setup
  script:
    - pip install -r reproduction/requirements.txt
    - pip install -e . --no-deps
    - cd reproduction/deposit
    - export GD_ROOT=$PWD MPLBACKEND=Agg SOURCE_DATE_EPOCH=1793059200
    - M=thesis-med/_paper/method-paper
    - python $M/scripts/make_revision_tables.py --out $M/revision_2026-10/tables
    - python $M/scripts/make_revision_figures.py data
  artifacts:
    paths:
      - reproduction/deposit/thesis-med/_paper/method-paper/revision_2026-10/tables/
      - reproduction/deposit/thesis-med/_paper/method-paper/revision_2026-10/figs/
    expire_in: 2 weeks

# Mirror GitLab -> GitHub (github.com/${GITHUB_USER}/pulse-ep-decay); GitHub releases are archived by Zenodo.
# Needs the CI variables GITHUB_USER and GITHUB_TOKEN (masked) and an existing GitHub repository.
mirror_to_github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - git config --global user.email "ci@willert.net"
    - git config --global user.name "GitLab CI (pulse-ep-decay)"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_USER}/pulse-ep-decay.git"
    - git fetch origin --tags
    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        # push what origin/main points at now, never with --force (see pulse-ep)
        git fetch origin main
        git push github "FETCH_HEAD:refs/heads/main"
      fi
    - git push github --tags
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
