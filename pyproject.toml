[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ep-decay"
version = "0.1.0"
description = "Geodesic spatial-resolution analysis for intracardiac pace-mapping — Heat Method, Gaussian decay fit, sigma validation. Scientific extension to pulse-ep."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "electrophysiology",
    "cardiology",
    "pace-mapping",
    "geodesic-distance",
    "heat-method",
    "mesh-analysis",
    "spatial-resolution",
    "gaussian-decay",
]
authors = [
    { name = "Sven Willert", email = "sw@willert.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

# Array-first core: no dependency on pulse-ep. Users can analyse any
# triangulated mesh + scalar field with the scientific kernel alone.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "potpourri3d>=1.0,<2",  # Heat Method via geometry-central
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Adapter that bridges to pulse-ep models (EPMapModel -> arrays).
# Installing this extra pulls pulse-ep + its DB stack.
pulse-ep = [
    "pulse-ep>=0.1,<1",
]
figures = [
    "trimesh>=4.5,<5",
    "pyvista>=0.44,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]
all = [
    "pulse-ep-decay[pulse-ep,figures,dev]",
]

[project.urls]
Homepage = "https://gitlab.willert.net/sw/pulse-ep-decay"
Repository = "https://gitlab.willert.net/sw/pulse-ep-decay"
Issues = "https://gitlab.willert.net/sw/pulse-ep-decay/-/issues"
Documentation = "https://gitlab.willert.net/sw/pulse-ep-decay#readme"
"Platform package" = "https://gitlab.willert.net/sw/pulse-ep"

[project.scripts]
pulse-ep-decay-spatial = "pulse_ep_decay.cli.spatial_decay:main"
pulse-ep-decay-validate-sigma = "pulse_ep_decay.cli.validate_sigma:main"
pulse-ep-decay-compare-geodesic = "pulse_ep_decay.cli.geodesic_comparison:main"
pulse-ep-decay-full-validation = "pulse_ep_decay.cli.run_full_validation:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulse_ep_decay*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
