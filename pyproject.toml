[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-ep-decay"
version = "1.0.0"
description = "Geodesic decay analysis of pace-mapping score maps on triangulated atrial surfaces; a module for pulse-ep."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sven Willert", email = "sw@willert.net" }]
keywords = [
    "electrophysiology",
    "pace-mapping",
    "geodesic-distance",
    "heat-method",
    "mesh-analysis",
    "spatial-resolution",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Array-first core: works on any triangulated mesh and per-vertex score without pulse-ep.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "potpourri3d>=1.0,<2",  # Heat Method (geometry-central)
]

[project.optional-dependencies]
exact = ["pygeodesic>=0.1.8"]  # exact geodesics (MMP), used in the validation
pulse-ep = ["pulse-ep>=0.6"]  # adapter pulse_ep_decay.integration.pulse_ep
repro = [  # reproduction/ scripts (tables and figures of the paper)
    "pandas>=2.0",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["pulse-ep-decay[exact,pulse-ep,repro,dev]"]

[project.urls]
Homepage = "https://github.com/swillert/pulse-ep-decay"
Repository = "https://github.com/swillert/pulse-ep-decay"
Issues = "https://github.com/swillert/pulse-ep-decay/issues"
"pulse-ep" = "https://github.com/swillert/pulse-ep"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pulse_ep_decay*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["reproduction"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
